<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSG Lineup</title>
    <!-- The suite's own host is the canonical surface (estate doctrine M5).
         This file only bounces a browser to core/; a social crawler does not
         run that script, so the card is built from these two lines. -->
    <link rel="canonical" href="https://tsg.thast.live/lineup/">
    <meta property="og:url" content="https://tsg.thast.live/lineup/">
    <script>
        // Redirect to the current application (the signal-spec renderer).
        window.location.replace('core/tsg-lineup.html');
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=core/tsg-lineup.html">
    </noscript>
</head>
<body>
    <p>Redirecting to <a href="core/tsg-lineup.html">TSG Lineup</a>...</p>
</body>
</html>
